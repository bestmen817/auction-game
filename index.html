<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1621">
<title>Аукцион вслепую</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
:root{--bg:#0e1621;--sf:#17212b;--sf2:#202e3d;--tx:#f5f7fa;--mu:#8b9bb0;--ac:#2aabee;--gr:#2ecc71;--gd:#f7b731;--rd:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(120% 55% at 50% 0,#1a2a3b,var(--bg) 62%);background-attachment:fixed;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button,input{font-family:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.usr{display:flex;align-items:center;gap:10px;min-width:0}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2aabee,#7b5cff);display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.nm{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rk{font-size:13px;color:var(--gd);font-weight:600;margin-top:2px}
.bal{display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:999px;padding:10px 16px;font-size:22px;font-weight:800;flex:none}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#ffe792,#f5a623 70%);box-shadow:inset 0 0 0 3px rgba(150,90,0,.35);flex:none}
.bump{animation:bump .55s ease}
.card{background:linear-gradient(180deg,var(--sf),#131c26);border-radius:26px;padding:22px 18px;box-shadow:0 12px 32px rgba(0,0,0,.4);text-align:center}
.flash{animation:in .5s ease}
h1{margin:0 0 6px;font-size:27px;line-height:1.2}
.prz{margin:0;color:var(--mu);font-size:16px}
.prz b{color:var(--gd)}
.tm{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px;margin:16px 0 8px;line-height:1}
.tm.low{color:var(--rd);animation:pulse 1s infinite}
.bar{height:8px;background:var(--sf2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ac),var(--gr));border-radius:99px;transition:width .25s linear}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats div{background:var(--sf2);border-radius:16px;padding:12px 8px}
.stats span{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.stats b{font-size:22px}
.stats b.seen{color:var(--gd)}
.inp{display:flex;align-items:center;gap:10px;background:var(--sf2);border-radius:16px;padding:0 16px;margin-bottom:10px;border:2px solid transparent;transition:border-color .2s}
.inp:focus-within{border-color:var(--ac)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:26px;font-weight:800;padding:14px 0;-moz-appearance:textfield;-webkit-user-select:text;user-select:text}
.inp input::placeholder{color:#5b6b7e;font-weight:600;font-size:18px}
.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.quick button{background:var(--sf2);color:var(--tx);border:0;border-radius:14px;padding:14px 0;font-size:18px;font-weight:700}
button{cursor:pointer;transition:transform .12s,opacity .2s,filter .2s}
button:active:not(:disabled){transform:scale(.96);filter:brightness(1.12)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.big{width:100%;border:0;border-radius:18px;padding:19px 14px;font-size:18px;line-height:1.25;font-weight:800}
.go{background:linear-gradient(135deg,#34d67a,#1fae5b);color:#04210f;box-shadow:0 8px 24px rgba(46,204,113,.35)}
.spy{background:linear-gradient(135deg,#7b5cff,#4f7cff);color:#fff;box-shadow:0 8px 24px rgba(99,102,255,.3)}
.gold{background:linear-gradient(135deg,#ffd75e,#f5a623);color:#3a2600;box-shadow:0 8px 24px rgba(247,183,49,.3)}
.box{background:var(--sf);border-radius:22px;padding:16px}
.box h2{margin:0 0 12px;font-size:16px;font-weight:700;color:var(--mu)}
.bottom{margin-top:auto}
.busy .app{pointer-events:none;opacity:.6}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,10,16,.75);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.mod{width:100%;max-width:400px;background:var(--sf);border-radius:28px;padding:26px 20px 20px;text-align:center;transform:translateY(20px) scale(.92);transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
.ov.on .mod{transform:none}
.ico{font-size:64px;line-height:1}
.mod h3{margin:10px 0 14px;font-size:28px}
.win{color:var(--gr)}
.lose{color:var(--rd)}
.rows{text-align:left;background:var(--sf2);border-radius:16px;padding:6px 14px;margin-bottom:16px;font-size:16px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.rows div:last-child{border:0}
.rows span{color:var(--mu)}
.rows b{text-align:right}
.adn{font-size:56px;font-weight:800;color:var(--gd)}
#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-180%);background:#2b3a4b;color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;font-size:16px;line-height:1.3;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,1.2,.4,1);z-index:40;pointer-events:none}
#toast.on{transform:translate(-50%,0)}
#ok{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:30;background:rgba(23,33,43,.96);border:1px solid rgba(46,204,113,.5);border-radius:24px;padding:24px 34px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:22px;font-weight:800;white-space:nowrap}
.okc{width:58px;height:58px;border-radius:50%;background:var(--gr);display:grid;place-items:center;font-size:34px;color:#04210f}
#ok.on{animation:okpop 1.3s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes bump{40%{transform:scale(1.18);color:var(--gd)}}
@keyframes okpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-64%) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="usr">
      <div class="ava" id="ava">И</div>
      <div><div class="nm" id="nm">Игрок</div><div class="rk" id="rk">Новичок</div></div>
    </div>
    <div class="bal" id="bal"><i class="coin"></i><span id="balv">100</span></div>
  </header>

  <section class="card" id="card">
    <h1 id="lot">Секретный кейс #104</h1>
    <p class="prz">Возможный выигрыш: <b id="prz">От 50 до 500 монет</b></p>
    <div class="tm" id="tm">0:30</div>
    <div class="bar"><i id="barf"></i></div>
    <div class="stats">
      <div><span>Ваша ставка</span><b id="mybid">0</b></div>
      <div><span>Чужая ставка</span><b id="rival">???</b></div>
    </div>
    <label class="inp"><i class="coin"></i><input id="amt" type="number" inputmode="numeric" min="1" step="1" placeholder="Сумма ставки"></label>
    <div class="quick">
      <button data-a="10">+10</button>
      <button data-a="50">+50</button>
      <button data-a="100">+100</button>
      <button data-a="all">Все</button>
    </div>
    <button class="big go" id="bet">СДЕЛАТЬ СТАВКУ</button>
  </section>

  <section class="box">
    <h2>Спецспособности</h2>
    <button class="big spy" id="spy">👁 Узнать чужую ставку (Смотреть рекламу)</button>
  </section>

  <section class="box bottom">
    <h2>Пополнение баланса</h2>
    <button class="big gold" id="ad">🎁 Получить +100 монет за просмотр рекламы</button>
  </section>
</div>

<div id="toast"></div>
<div id="ok"><div class="okc">✓</div><span>Ставка принята!</span></div>

<div class="ov" id="modal">
  <div class="mod">
    <div class="ico" id="mi">🏆</div>
    <h3 id="mt">Результат</h3>
    <div class="rows" id="mr"></div>
    <button class="big go" id="mc">Следующий раунд</button>
  </div>
</div>

<div class="ov" id="adov">
  <div class="mod">
    <div class="ico">📺</div>
    <h3>Реклама</h3>
    <p style="color:var(--mu);margin:0 0 8px">Тестовый показ: рекламный блок недоступен</p>
    <div class="adn" id="adn">3</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
  var tg = window.Telegram && window.Telegram.WebApp;
  try { tg.setHeaderColor('#0e1621'); tg.setBackgroundColor('#0e1621'); } catch (e) {}

  var KEY = 'blind_auction_v1';
  var ROUND = 30;
  var REWARD = 100;
  var AD_BLOCK_ID = 'YOUR_BLOCK_ID'; // сюда вставьте свой blockId из кабинета AdsGram
  var LOTS = [['Секретный кейс', 50, 500], ['Тёмный сундук', 30, 300], ['Золотой слиток', 100, 800], ['Кристалл удачи', 20, 200]];

  var $ = function (id) { return document.getElementById(id); };
  var locked = false, busy = false, shown = null, lastNo = null, toastT;

  function newRound(no, idx) {
    var l = LOTS[idx === undefined ? Math.floor(Math.random() * LOTS.length) : idx];
    return {
      no: no, name: l[0], min: l[1], max: l[2],
      rival: Math.round(l[2] * (0.05 + Math.random() * 0.45)),
      bid: 0, peeked: false, end: Date.now() + ROUND * 1000
    };
  }

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s.balance === 'number' && s.round && typeof s.round.end === 'number') return s;
    } catch (e) {}
    return { balance: 100, round: newRound(104, 0) };
  }

  var S = load();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function fmt(n) { return Number(n).toLocaleString('ru-RU'); }
  function hap(t) {
    try { t === 'tap' ? tg.HapticFeedback.impactOccurred('light') : tg.HapticFeedback.notificationOccurred(t); } catch (e) {}
  }
  function toast(m) {
    var t = $('toast');
    t.textContent = m;
    t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('on'); }, 2800);
  }
  function anim(el, c) { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }
  function rank() {
    var b = S.balance;
    return b < 1 ? 'Без монет' : b < 200 ? 'Новичок' : b < 600 ? 'Торговец' : b < 1500 ? 'Аукционист' : 'Магнат';
  }

  function render() {
    var r = S.round;
    $('balv').textContent = fmt(S.balance);
    if (shown !== null && shown !== S.balance) anim($('bal'), 'bump');
    shown = S.balance;
    $('rk').textContent = rank();
    $('lot').textContent = r.name + ' #' + r.no;
    $('prz').textContent = 'От ' + r.min + ' до ' + r.max + ' монет';
    $('mybid').textContent = fmt(r.bid);
    var rv = $('rival');
    rv.textContent = r.peeked ? fmt(r.rival) : '???';
    rv.className = r.peeked ? 'seen' : '';
    $('spy').disabled = r.peeked;
    $('spy').textContent = r.peeked ? '👁 Чужая ставка раскрыта' : '👁 Узнать чужую ставку (Смотреть рекламу)';
    if (lastNo !== r.no) {
      if (lastNo !== null) anim($('card'), 'flash');
      lastNo = r.no;
    }
  }

  function draw() {
    var left = Math.max(0, S.round.end - Date.now());
    var s = Math.ceil(left / 1000);
    var t = $('tm');
    t.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    t.classList.toggle('low', s > 0 && s <= 10);
    $('barf').style.width = (left / (ROUND * 10)) + '%';
    return left;
  }

  function showResult(x) {
    var w = x.type === 'win', l = x.type === 'lose';
    var h = '<div><span>Лот</span><b>' + x.lot + '</b></div>' +
            '<div><span>Ваша ставка</span><b>' + fmt(x.bid) + '</b></div>' +
            '<div><span>Чужая ставка</span><b>' + fmt(x.rival) + '</b></div>';
    if (w) {
      h += '<div><span>Вы выиграли</span><b class="win">+' + fmt(x.prize) + ' монет</b></div>' +
           '<div><span>Чистый итог</span><b class="' + (x.net >= 0 ? 'win' : 'lose') + '">' +
           (x.net >= 0 ? '+' : '−') + fmt(Math.abs(x.net)) + '</b></div>';
    } else {
      h += '<div><span>Вы выиграли</span><b>0 монет' + (l ? ' (ставка возвращена)' : '') + '</b></div>';
    }
    $('mi').textContent = w ? '🏆' : l ? '😔' : '⏱';
    var t = $('mt');
    t.textContent = w ? 'Вы победили!' : l ? 'Вы проиграли' : 'Раунд завершён';
    t.className = w ? 'win' : l ? 'lose' : '';
    $('mr').innerHTML = h;
    $('modal').classList.add('on');
    hap(w ? 'success' : l ? 'error' : 'warning');
  }

  function finish() {
    locked = true;
    var r = S.round;
    var x = { lot: r.name + ' #' + r.no, bid: r.bid, rival: r.rival };
    if (r.bid > r.rival) {
      x.type = 'win';
      x.prize = r.min + Math.floor(Math.random() * (r.max - r.min + 1));
      x.net = x.prize - r.bid;
      S.balance += x.prize;
    } else {
      x.type = r.bid > 0 ? 'lose' : 'skip';
      S.balance += r.bid;
    }
    S.round = newRound(r.no + 1);
    save();
    setTimeout(function () { render(); draw(); showResult(x); }, 700);
  }

  $('mc').onclick = function () {
    $('modal').classList.remove('on');
    S.round.end = Date.now() + ROUND * 1000;
    save();
    draw();
    locked = false;
    hap('tap');
  };

  setInterval(function () {
    if (!locked && !busy && draw() <= 0) finish();
  }, 200);

  function bet() {
    if (locked || busy) return;
    var a = Math.floor(Number($('amt').value));
    if (!(a > 0)) return toast(S.balance > 0 ? 'Введите сумму ставки' : 'Нет монет: пополните баланс рекламой');
    if (a > S.balance) return toast('Недостаточно монет. Ваш баланс: ' + fmt(S.balance));
    S.balance -= a;
    S.round.bid += a;
    save();
    render();
    $('amt').value = '';
    $('amt').blur();
    anim($('ok'), 'on');
    hap('success');
  }

  $('bet').onclick = bet;
  $('amt').onkeydown = function (e) { if (e.key === 'Enter') bet(); };

  document.querySelectorAll('.quick button').forEach(function (b) {
    b.onclick = function () {
      var v = b.dataset.a === 'all' ? S.balance : Math.min(S.balance, (Number($('amt').value) || 0) + Number(b.dataset.a));
      $('amt').value = v > 0 ? v : '';
      hap('tap');
    };
  });

  function simAd() {
    return new Promise(function (res) {
      var n = 3, o = $('adov');
      $('adn').textContent = n;
      o.classList.add('on');
      var i = setInterval(function () {
        n--;
        $('adn').textContent = n;
        if (n <= 0) { clearInterval(i); o.classList.remove('on'); res(true); }
      }, 1000);
    });
  }

  function showRewardedAd() {
    return new Promise(function (res) {
      var c = null;
      try { c = window.Adsgram ? window.Adsgram.init({ blockId: AD_BLOCK_ID }) : null; } catch (e) { c = null; }
      if (!c) { simAd().then(res); return; }
      try {
        c.show().then(function (r) {
          res(!!(r && r.done));
        }).catch(function (r) {
          if (r && r.error === false) res(false);
          else simAd().then(res);
        });
      } catch (e) { simAd().then(res); }
    });
  }

  function watchAd(onReward) {
    if (busy || locked) return;
    busy = true;
    document.body.classList.add('busy');
    var t0 = Date.now();
    showRewardedAd().then(function (ok) {
      busy = false;
      document.body.classList.remove('busy');
      S.round.end += Date.now() - t0;
      if (ok) onReward(); else toast('Реклама не досмотрена: награда не начислена');
      save();
      render();
    });
  }

  $('ad').onclick = function () {
    watchAd(function () {
      S.balance += REWARD;
      toast('Вам начислено +' + REWARD + ' монет!');
      hap('success');
    });
  };

  $('spy').onclick = function () {
    if (S.round.peeked) return;
    watchAd(function () {
      S.round.peeked = true;
      toast('Чужая ставка: ' + fmt(S.round.rival) + '. Поставьте больше, чтобы выиграть!');
      hap('success');
    });
  };

  var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  var name = (u && (u.first_name || u.username)) || 'Игрок';
  $('nm').textContent = name;
  $('ava').textContent = name.charAt(0).toUpperCase();

  render();
  draw();
})();
</script>
</body>
</html>
